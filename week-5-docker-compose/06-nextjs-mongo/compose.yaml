# A Next.js app talking to MongoDB — all in Docker Compose.
# Start:  docker compose up -d --build   then open http://SERVER_IP:3000
# (first build takes a minute — it installs Next and builds the app)

services:
  web:
    build: ./web                 # Next.js app (multi-stage Dockerfile)
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://db:27017   # "db" = the service name below
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mongo:8
    volumes:
      - nextdata:/data/db          # messages survive restarts
    restart: unless-stopped

volumes:
  nextdata:
