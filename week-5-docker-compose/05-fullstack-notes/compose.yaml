# A real 3-service project: notes app
#   web (nginx)  ->  api (Node/Express)  ->  db (MongoDB)
#
# First:  cp .env.example .env       (Compose reads .env automatically)
# Start:  docker compose up -d --build   then open http://SERVER_IP:8080

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    environment:
      # credentials come from .env — no secrets hard-coded in this file
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/?authSource=admin
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - notesdata:/data/db        # notes survive restarts
    restart: unless-stopped

volumes:
  notesdata:
