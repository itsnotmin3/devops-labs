<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site A</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #ecfdf5;
      }
      .card {
        text-align: center;
        padding: 44px 56px;
        background: #fff;
        border: 3px solid #10b981;
        border-radius: 20px;
        box-shadow: 0 16px 40px #10b98122;
      }
      h1 { font-size: 56px; margin: 0.1em 0; color: #047857; }
      p { color: #475569; }
      code { background: #f1f5f9; padding: 2px 7px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🟢 Site A</h1>
      <p>This is <code>sitea.com</code></p>
      <p>Served from <code>/var/www/site-a</code></p>
    </div>
  </body>
</html>
