# =============================================================================
#  NGINX live-demo config — static site, virtual hosts, reverse proxy,
#  load balancing, and /api routing. Pairs with the apps in this labs/ folder.
#
#  SETUP
#  -----
#  1) Start the apps first (in this folder):
#       pm2 start ecosystem.config.js          # backend 3000, web 3001-3003, api 4000
#
#  2) Copy the static sites where nginx can read them (avoids /home 403s):
#       sudo cp -r static-site site-a site-b /var/www/
#
#  3) Install this config:
#       sudo cp demo.conf /etc/nginx/sites-available/demo.conf
#       sudo ln -s /etc/nginx/sites-available/demo.conf /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default   # avoid default_server clash
#       sudo nginx -t && sudo systemctl reload nginx
#
#  TESTING (no DNS needed)
#  -----------------------
#  Either add to your LAPTOP's hosts file, pointing at the server IP:
#       SERVER_IP  app.local sitea.local siteb.local
#  ...or just send a Host header with curl:
#       curl http://SERVER_IP/                       # -> static site
#       curl -H "Host: sitea.local" http://SERVER_IP/  # -> Site A
#       curl -H "Host: app.local"   http://SERVER_IP/  # -> load-balanced (repeat!)
#       curl -H "Host: app.local"   http://SERVER_IP/api/users
# =============================================================================

# ---- Load-balancing pool: the three app.js instances ----
upstream demo_backends {
    # default is round-robin; uncomment ONE to change strategy:
    # least_conn;        # send to the least-busy backend
    # ip_hash;           # pin each client IP to one backend (sticky)
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
}

# ---- 1) Static site — the default for the raw IP / unknown hostnames ----
server {
    listen 80 default_server;
    server_name _;

    root /var/www/static-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---- 2) Virtual hosts — two static sites chosen by hostname ----
server {
    listen 80;
    server_name sitea.local;

    root /var/www/site-a;
    index index.html;
}

server {
    listen 80;
    server_name siteb.local;

    root /var/www/site-b;
    index index.html;
}

# ---- 3) Reverse proxy + load balancing + /api routing ----
server {
    listen 80;
    server_name app.local;

    # Load-balance "/" across the three backends.
    # Refresh in the browser and watch the colour/port change each time.
    location / {
        proxy_pass http://demo_backends;

        # --- want a PLAIN reverse proxy to ONE backend instead? use this line:
        # proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/ to the api.js service on port 4000.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
}
