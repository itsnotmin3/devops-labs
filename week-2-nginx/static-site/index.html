<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static Site · NGINX demo</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        max-width: 520px;
        text-align: center;
        padding: 40px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        box-shadow: 0 20px 50px #00000040;
      }
      h1 { font-size: 44px; margin: 0.2em 0; }
      .tag { color: #38bdf8; font-weight: 700; letter-spacing: 0.1em; font-size: 12px; text-transform: uppercase; }
      p { color: #94a3b8; line-height: 1.7; }
      code { background: #0f172a; padding: 2px 7px; border-radius: 6px; color: #7dd3fc; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">📄 Served by NGINX</div>
      <h1>Static Site</h1>
      <p>
        These are just files in <code>/var/www/static-site</code> — no app, no Node, no port.
        NGINX reads the file off disk and sends it. This is the fastest thing NGINX does.
      </p>
      <p><code>try_files $uri $uri/ =404;</code></p>
    </div>
  </body>
</html>
