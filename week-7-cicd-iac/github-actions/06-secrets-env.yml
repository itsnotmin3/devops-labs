# 06 — Configuration and secrets.
# env: plain values (fine in the file). secrets: never in the file.
# Add secrets at: Settings > Secrets and variables > Actions > New repository secret
name: 06 Secrets & env

on: workflow_dispatch

env:
  APP_ENV: production # workflow-wide, not secret

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Plain env var
        run: echo "APP_ENV is $APP_ENV"

      - name: Use a secret safely
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }} # inject it as an env var
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "MY_SECRET is not set — add it in repo Settings > Secrets"
          else
            echo "MY_SECRET is set (${#MY_SECRET} characters)"
          fi
      # NOTE: never `echo` a real secret. GitHub masks known secrets in logs,
      # but printing them is still a bad habit.
