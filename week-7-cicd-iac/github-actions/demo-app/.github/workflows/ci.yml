# The pipeline. GitHub runs this automatically on every push and pull request
# to a repo that contains it at .github/workflows/ci.yml.
#
#   test   -> lint, test, build the app
#   docker -> build a Docker image and push it to this repo's GHCR, on main only
#
# It maps 1:1 onto Session 19: trigger -> jobs -> steps -> a gated deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci # install exactly what the lockfile says
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: test # only if the test job passed — this is the gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically — do NOT create it

      # GHCR image names must be lowercase; owner/repo may contain capitals.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SHA tag = an artifact whose name says exactly which commit built it.
          # latest = a moving bookmark. Deploy the SHA, never latest.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
