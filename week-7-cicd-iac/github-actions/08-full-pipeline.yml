# 08 — The whole thing: test -> build image -> deploy to your server.
# This is the pipeline you actually ship with.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST  your server IP        (e.g. 54.23.10.45)
#   SSH_USER  ubuntu
#   SSH_KEY   the CONTENTS of your private .pem key
name: 08 Full pipeline
on:
  push:
    branches: [main]
jobs:
  # 1) gate: nothing ships unless tests pass
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --if-present

  # 2) build the image and push it
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects uppercase; GITHUB_REPOSITORY keeps the owner's casing
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 3) log in to GHCR on the server, pull the new image, and restart
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read              # GITHUB_TOKEN needs read to pull the image
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided; no PAT needed
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # forward these env vars into the remote script (or they won't exist there)
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            # GHCR packages are private by default — log in before pulling.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker rm -f app || true
            docker run -d --name app -p 3000:3000 --restart unless-stopped "$IMAGE"
            docker logout ghcr.io
            docker image prune -f
