# 07 — Build the Docker image you wrote in Week 4 and push it to a registry.
# Uses GitHub Container Registry (ghcr.io) — no extra credentials needed,
# GITHUB_TOKEN is provided automatically.
name: 07 Docker build & push

on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
