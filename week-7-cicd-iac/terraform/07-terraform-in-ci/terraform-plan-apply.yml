# 07 — plan on the pull request, apply on merge.
#
# The pattern Session 21 designed and Session 22 finishes. Infrastructure gets
# the SAME treatment as application code: reviewed, gated, automated.
#
# Copy to .github/workflows/terraform.yml in your own repo.
# It lives here (not in .github/workflows/) so it does NOT run on the labs repo.

name: Terraform

on:
  pull_request:
    paths: ['infra/**']
  push:
    branches: [main]
    paths: ['infra/**']

permissions:
  contents: read
  pull-requests: write   # to comment the plan on the PR
  id-token: write        # to get an OIDC token for AWS

# Never let two applies race. The state lock would save you, but queueing is
# politer than a failed job.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # No long-lived AWS keys anywhere. GitHub proves its identity to AWS
      # directly and gets a token that expires in an hour.
      # A leaked permanent key is an incident; this is not.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions
          aws-region: ap-south-1

      - name: Format check
        run: terraform fmt -check -recursive
        # Ends style arguments mechanically. Same instinct as a linter.

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tfplan

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process')
            const out = execSync('terraform show -no-color tfplan', { cwd: 'infra' }).toString()
            // GitHub rejects comments over 65536 chars — a big plan will hit this.
            const body = out.length > 60000
              ? '### Terraform Plan (truncated — see the job log)\n\n```\n' + out.slice(0, 60000) + '\n```'
              : '### Terraform Plan\n\n```\n' + out + '\n```'
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
