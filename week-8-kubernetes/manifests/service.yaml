# A Service gives the Pods one stable address and load-balances across them.
# NodePort here so you can curl it directly in the lab (the session default is
# ClusterIP, which is in-cluster only).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web # send traffic to Pods labelled app=web
  ports:
    - port: 80
      targetPort: 80
