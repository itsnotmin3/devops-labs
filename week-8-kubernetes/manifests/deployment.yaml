# A Deployment = a Pod template + a desired count. This is what you actually run.
# It keeps `replicas` Pods alive, self-heals, scales, and rolls out updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3 # keep three Pods running at all times
  selector:
    matchLabels:
      app: web # <-- must match the template labels below
  template:
    metadata:
      labels:
        app: web # <-- and this must match the selector above
    spec:
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
