# Full-stack demo: nginx (web) -> Node API -> MongoDB
# Start:  docker compose up -d --build
# Open:   http://SERVER_IP:8080   (refresh to watch the visit counter climb)
# Stop:   docker compose down          (keeps the DB volume)
#         docker compose down -v       (also deletes the DB data)

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./api
    environment:
      MONGO_URL: mongodb://db:27017   # "db" is the service name below (Compose DNS)
    depends_on:
      - db

  db:
    image: mongo:7
    volumes:
      - dbdata:/data/db               # named volume -> data survives restarts

volumes:
  dbdata:
