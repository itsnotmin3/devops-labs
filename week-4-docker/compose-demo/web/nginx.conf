server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # serve the static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy API calls to the "api" service (Compose DNS resolves the name)
    location /api {
        proxy_pass http://api:3000;
    }
    location /health {
        proxy_pass http://api:3000;
    }
}
