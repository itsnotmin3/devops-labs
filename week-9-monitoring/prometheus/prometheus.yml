global:
  scrape_interval: 15s # how often to pull metrics from each target

scrape_configs:
  # Prometheus scrapes itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # host metrics (CPU, memory, disk, network)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"] # service name = Compose DNS

  # OUR APP — it exposes /metrics on :3000 inside the Compose network.
  # (Container name is store-api; the port is the in-container 3000, not 8080.)
  - job_name: store-api
    static_configs:
      - targets: ["store-api:3000"]
