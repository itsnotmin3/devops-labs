server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml # remembers how far it has read

clients:
  - url: http://loki:3100/loki/api/v1/push # ship to Loki (Compose DNS)

scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs # <- the LABEL you query by in LogQL
          host: demo
          __path__: /var/log/*log # which files to tail
