server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml # remembers how far it has read

clients:
  - url: http://loki:3100/loki/api/v1/push # ship to Loki (Compose DNS)

scrape_configs:
  # 1. The host's own log files (syslog, auth…). Query with {job="varlogs"}.
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: demo
          __path__: /var/log/*log

  # 2. OUR APP's logs. Every container writes stdout to a json file under
  #    /var/lib/docker/containers; Docker service discovery finds them and we
  #    label each stream by container name. Query with {app="store-api"}.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # container name comes through as "/store-api" — strip the slash into `app`
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "app"
      - target_label: "env"
        replacement: "demo"
