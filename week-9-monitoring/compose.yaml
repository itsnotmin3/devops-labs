# A complete local observability stack, with an app to watch:
#   store-api    the instrumented demo app (exposes /metrics, logs JSON)
#   Prometheus + node-exporter    metrics (the app + the host)
#   Loki + Promtail               logs (ships the app's container logs)
#   Grafana                       dashboards over both, pre-wired + a dashboard
#
# Start:  docker compose up -d --build
#   Grafana:    http://SERVER_IP:3000   (admin / admin)
#   Prometheus: http://SERVER_IP:9090
#   The app:    http://SERVER_IP:8080   (Grafana already owns :3000)

services:
  # ---- the application we are monitoring ----
  app:
    build: ./app
    container_name: store-api
    ports:
      - "8080:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/log:/var/log:ro # the host's own logs (syslog, auth…)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # container stdout
      - /var/run/docker.sock:/var/run/docker.sock:ro # discover containers
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # demo only — change for anything real
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  promdata:
  grafanadata:
