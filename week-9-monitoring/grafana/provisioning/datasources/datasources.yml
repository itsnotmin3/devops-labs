# Grafana reads this on startup, so both datasources are wired up for you.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus # fixed uid so the provisioned dashboard can reference it
    access: proxy
    url: http://prometheus:9090 # service name = Compose DNS
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
